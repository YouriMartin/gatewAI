# Preset: every tier on one OpenAI-compatible endpoint (v4 C.3).
#
#   SPRING_PROFILES_ACTIVE=openai-compatible
#   OPENAI_COMPATIBLE_BASE_URL=https://api.example.com/v1   # the root that serves /chat/completions
#   OPENAI_COMPATIBLE_API_KEY=...                           # optional: blank = no auth header
#   GATEWAI_MODEL_SMALL / GATEWAI_MODEL_MEDIUM / GATEWAI_MODEL_LARGE = three distinct model ids
#
# It moves the three default registry entries (application.properties) to one
# instance and changes nothing else: same tiers, same routing, same cache. The
# endpoint and the model ids have no default on purpose — a preset that guessed
# them would fail on the first request instead of at startup.
#
# What it does not declare: pricing, energy and region. The entries keep their
# not-accounted energy label and no price, so cost reads zero labelled NONE and
# carbon "excluded from scope" rather than a figure nobody sourced; the startup log warns
# that the instance has no region. Declare them in your own configuration once you
# know them (docs/technical/green-accounting.md, docs/technical/routing.md).
gatewai.providers.openai-compatible.type=openai-compatible
gatewai.providers.openai-compatible.base-url=${OPENAI_COMPATIBLE_BASE_URL}
gatewai.providers.openai-compatible.api-key=${OPENAI_COMPATIBLE_API_KEY:}

gatewai.models.registry.local-small.provider=openai-compatible
gatewai.models.registry.local-small.model-id=${GATEWAI_MODEL_SMALL}
gatewai.models.registry.local-medium.provider=openai-compatible
gatewai.models.registry.local-medium.model-id=${GATEWAI_MODEL_MEDIUM}
gatewai.models.registry.local-large.provider=openai-compatible
gatewai.models.registry.local-large.model-id=${GATEWAI_MODEL_LARGE}
