spring.application.name=gatewai

# Virtual Threads
spring.threads.virtual.enabled=true

# --- Model auto-configuration ---
# Chat egress is built by EgressProviderConfiguration from gatewai.providers.*
# below — the provider chat auto-configs are excluded so that NO vendor is
# privileged or required. Since v3 lot A the embedding auto-configs are excluded
# too: embeddings run in-process (ONNX, below), so no model server is on the
# decision path.
spring.autoconfigure.exclude=\
  org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# (Last exclude above) Auth is API-key based (ApiKeyAuthenticationFilter); we
# don't use Spring's default in-memory user. Excluding it removes the misleading
# "Using generated security password" log — that UUID is NOT the API key.

# --- Egress provider instances (gatewai.providers.<name>) ---
# Each instance is one connection the gateway can dispatch to; model-registry
# entries below reference an instance by name. Only instances actually
# referenced by the registry are built at startup, so unused ones need no
# credentials. Types: anthropic | openai | openai-compatible | ollama.
gatewai.providers.ollama.type=ollama
gatewai.providers.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

# Cloud instances — declared but dormant until a registry entry references them.
gatewai.providers.anthropic.type=anthropic
gatewai.providers.anthropic.api-key=${ANTHROPIC_API_KEY:}
gatewai.providers.openai.type=openai
gatewai.providers.openai.api-key=${OPENAI_API_KEY:}

# Any server speaking the OpenAI wire format works too (vLLM, LM Studio,
# llama.cpp, OpenRouter, Azure OpenAI…), and extra Ollama servers are just more
# instances:
#gatewai.providers.vllm.type=openai-compatible
#gatewai.providers.vllm.base-url=http://gpu-box:8000/v1
#gatewai.providers.ollama-gpu.type=ollama
#gatewai.providers.ollama-gpu.base-url=http://gpu-host:11434

# Bootstrap admin API key (Phase 5.1). When set, an admin client is seeded with
# this exact key at startup (idempotent) — use it as your Bearer token. Leave
# blank to fall back to a random key logged once at first start. Prefix it with
# 'gw_' for consistency.
gatewai.admin.api-key=${GATEWAI_ADMIN_API_KEY:}

# --- Embeddings: in-process ONNX (v3 lot A) ---
# The semantic cache, the semantic routes and the explanation services embed
# through DJL + ONNX Runtime inside the JVM. The model and its tokenizer are
# classpath resources shipped in the jar, so a cold start downloads nothing and
# reaches no model server. Ollama remains the default *egress* only.
#
# Provisional model: paraphrase-multilingual-MiniLM-L12-v2, int8-quantised,
# 384 dimensions, EN/FR. v3 batch A.3 measures the candidates and confirms or
# replaces it — swapping the model means a new resource directory, these two
# lines, and re-recorded fixtures/calibrations (A.4).
gatewai.embedding.model-id=paraphrase-multilingual-MiniLM-L12-v2
spring.ai.embedding.transformer.onnx.model-uri=classpath:/onnx/paraphrase-multilingual-MiniLM-L12-v2/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=classpath:/onnx/paraphrase-multilingual-MiniLM-L12-v2/tokenizer.json
# The tokenizer pads to the longest sequence in the batch; without this, a batch
# of ragged inputs (route-example indexing) fails on tensor shape.
spring.ai.embedding.transformer.tokenizer.options.padding=true
# Resources loaded from a jar cannot be memory-mapped, so Spring AI copies them
# to this directory on first start (~135 MB). From an exploded classpath
# (./mvnw spring-boot:run, tests) nothing is copied.
spring.ai.embedding.transformer.cache.directory=${GATEWAI_ONNX_CACHE:${java.io.tmpdir}/gatewai-onnx}

# JPA / Hibernate — the schema is owned by Flyway (below), so Hibernate only
# checks that the entities match it and never writes DDL.
spring.jpa.hibernate.ddl-auto=validate

# Flyway (v2 batch 0.1) — versioned migrations in db/migration.
# baseline-on-migrate + baseline-version=0: databases created by the previous
# ddl-auto=update are non-empty, so Flyway baselines them at 0 and still replays
# V1, which is written idempotently (CREATE TABLE IF NOT EXISTS). Same story on
# a fresh database where PgVectorStore created vector_store first.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# pgvector (semantic cache + metrics — same database). The vector_store table
# and the `vector` extension stay owned by Spring AI, NOT by Flyway: the gateway
# depends on the VectorStore interface, not on pgvector DDL (ADR 0005).
spring.ai.vectorstore.pgvector.initialize-schema=true
# 384 since v3 lot A: the in-process ONNX model embeds at 384, not nomic's 768.
# An existing vector_store table built at 768 must be dropped and refilled —
# it is a cache, see docs/technical/data-model.md.
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
# Pre-flight check when upgrading a database written at another width: it turns
# "the cache silently errors on every lookup" into a startup failure naming both
# dimensions. Deliberately OFF by default — validation runs *instead of*
# creation, so it also refuses to start on a fresh database. See
# docs/technical/data-model.md.
#spring.ai.vectorstore.pgvector.schema-validation=true

# Semantic cache
# similarity-threshold is applied by the advisor, not by the store (v2 batch 2):
# the store ranks, the advisor accepts or rejects. That is what makes the
# runner-up score — and the near-misses batch 3 calibrates on — observable.
gatewai.cache.similarity-threshold=0.92
# Candidates fetched per lookup. Raised from 1 to 2 so a runner-up exists to
# compare against; values below 2 are lifted to 2.
gatewai.cache.top-k=2
gatewai.cache.ttl-minutes=0
gatewai.cache.client-namespacing=true

# Decision tracing (v2 batch 2) — why the cache answered and why the router
# picked a tier, written off the request path into routing_decision /
# cache_decision. Prompts are stored as SHA-256 hashes, never as text.
gatewai.decisions.enabled=true
gatewai.decisions.retention-days=90
gatewai.decisions.purge-interval-ms=86400000

# Conformal calibration (v2 batch 3) — replaces the two guessed thresholds
# (cache 0.92, routing 0.60) with quantiles fitted on labelled data. Nothing is
# calibrated until POST /v1/admin/calibration is called; until then, and
# whenever a calibration no longer matches the embedding model or the routing
# rules, the fixed thresholds above and below apply.
gatewai.conformal.enabled=true
# Routing: share of prompts whose correct route may fall outside the prediction
# set. Missing it costs a hand-over to the heuristic, so it can afford to be
# generous.
gatewai.conformal.routing-alpha=0.10
# Cache: share of non-servable pairs that may be served anyway. A wrong answer
# is user-visible, so this is the tighter of the two — 0.10 is roughly half the
# wrong-answer rate the guessed 0.92 threshold was implicitly accepting (that
# constant corresponds to alpha ~ 0.20 on the shipped labelled set).
# Values at or below ~0.054 are unreachable with the default labels: four pairs
# ask the same volatile question twice and score 1.0, so no similarity threshold
# can exclude them. See docs/technical/conformal-calibration.md.
gatewai.conformal.cache-alpha=0.10
# Labelled cases the quantiles are fitted on. Spring resource locations: point
# them at your own labelled traffic (file:/etc/gatewai/…) to calibrate on it.
gatewai.conformal.routing-cases=classpath:/eval/routing-calibration.jsonl
gatewai.conformal.cache-cases=classpath:/eval/cache-calibration.jsonl

# Model registry — LOCAL-FIRST by default: the gateway is fully usable with
# zero API keys. Three Qwen sizes cover the three routing tiers; the first run
# pulls them into Ollama (~3 GB total, one-time). For frontier-model quality on
# the premium tier, swap in a cloud entry (example below).
#
# provider = a gatewai.providers.<name> instance above.
# tier = routing class (local | cloud-entry | cloud-premium). The names are
#   capability classes, not locations — entry/premium tiers may be local models,
#   as they are by default. Routing picks the FIRST entry declared per tier, so
#   to repoint a tier, replace its entry rather than adding a second one.
# model-id must be unique across the registry (dispatch resolves by id).
# cost-per-1k-tokens = rough blended (input+output)/2 list price, in the billing
#   currency (0 for self-hosted). energy-intensity = estimated kWh per 1k tokens
#   (energy only, NOT carbon; carbon = energy-intensity x grid intensity). No
#   provider publishes official per-inference energy; these are rough
#   placeholders preserving the order premium > entry > local.
gatewai.models.registry.local-small.provider=ollama
gatewai.models.registry.local-small.model-id=qwen2.5:0.5b
gatewai.models.registry.local-small.cost-per-1k-tokens=0.0
gatewai.models.registry.local-small.energy-intensity=0.0005
gatewai.models.registry.local-small.tier=local

gatewai.models.registry.local-medium.provider=ollama
gatewai.models.registry.local-medium.model-id=qwen2.5:1.5b
gatewai.models.registry.local-medium.cost-per-1k-tokens=0.0
gatewai.models.registry.local-medium.energy-intensity=0.001
gatewai.models.registry.local-medium.tier=cloud-entry

gatewai.models.registry.local-large.provider=ollama
gatewai.models.registry.local-large.model-id=qwen2.5:3b
gatewai.models.registry.local-large.cost-per-1k-tokens=0.0
gatewai.models.registry.local-large.energy-intensity=0.002
gatewai.models.registry.local-large.tier=cloud-premium

# Cloud opt-in example — Claude as the premium tier: set ANTHROPIC_API_KEY,
# comment out the local-large entry above and uncomment this one. Any provider
# instance works the same way (model ids verified 2026-06-28: premium =
# claude-opus-4-8, cheaper premium = claude-sonnet-4-6, entry = claude-haiku-4-5).
#gatewai.models.registry.claude-premium.provider=anthropic
#gatewai.models.registry.claude-premium.model-id=claude-opus-4-8
#gatewai.models.registry.claude-premium.cost-per-1k-tokens=0.015
#gatewai.models.registry.claude-premium.energy-intensity=0.005
#gatewai.models.registry.claude-premium.tier=cloud-premium

# Carbon model (Phase 4.1)
# Static grid carbon intensity (gCO2-eq/kWh), used as default and as fallback.
# ~230 ~= a typical European grid average; e.g. France ~56, world ~480.
gatewai.carbon.grid-intensity-grams-per-kwh=230.0

# Real-time carbon intensity via ElectricityMaps (Phase 4.2)
# Disabled by default => StaticCarbonIntensityProvider is used. Enable and set a
# token to fetch live values; on any API error it falls back to the static value.
gatewai.carbon.electricity-maps.enabled=false
gatewai.carbon.electricity-maps.base-url=https://api.electricitymap.org/v3
gatewai.carbon.electricity-maps.zone=FR
gatewai.carbon.electricity-maps.token=${ELECTRICITY_MAPS_TOKEN:}

# Static per-zone intensities (gCO2-eq/kWh) for offline geo routing demos.
# Used by the default provider when ElectricityMaps is disabled.
gatewai.carbon.zone-intensities.FR=56
gatewai.carbon.zone-intensities.SE=30
gatewai.carbon.zone-intensities.DE=380
gatewai.carbon.zone-intensities.PL=650

# Carbon-aware deferred dispatch (Phase 4.4)
# Disabled by default: async endpoint queues jobs, worker runs only when enabled.
gatewai.dispatch.enabled=false
gatewai.dispatch.poll-interval-ms=5000
gatewai.dispatch.candidate-zones=FR,SE,DE,PL
# Since v3 lot B.2 the queue is the deferred_job table and a worker claims jobs
# with FOR UPDATE SKIP LOCKED, so every replica can run the same queue without a
# job running twice. Two knobs come with that:
# - max-jobs-per-tick bounds one tick, so a full queue cannot keep one node busy
#   while the others idle; the remainder goes to whoever claims first next tick.
# - job-lease-ms is how long a claim is held. A node that dies mid-job leaves its
#   row RUNNING, and the next tick on any node requeues it once the lease expires.
#   Concurrent claims are exactly-once; a lease expiry is at-least-once, so keep
#   this well above one completion (raise it for a slow provider, lower it to
#   recover a dead node's jobs sooner). See docs/technical/carbon-aware-dispatch.md.
gatewai.dispatch.max-jobs-per-tick=20
gatewai.dispatch.job-lease-ms=300000
# Name written to deferred_job.claimed_by ("which node ran this?"). Unset =>
# host:pid, which already tells two replicas apart; set it when the deployment has
# its own name for the node (a pod name, say).
gatewai.instance-id=

# Complexity classifier (router)
# strategy=embedding (default: semantic routes, local embedding, multilingual),
# heuristic (zero cost: length + keywords), llm (cheap model + structured output)
# or cascade (v2 batch 4: deterministic signals -> routes -> model on ambiguity)
gatewai.classifier.strategy=embedding
# Cascade only: how close the runner-up route must be for the tier to count as
# ambiguous and the classifier model to be called. Measured on the labelled set:
# 0.02 escalates 23% of requests and those hold 61% of the routing errors. The
# trade-off curve is in the evaluation report (docs/technical/evaluation.md).
gatewai.classifier.cascade-margin-band=0.02
# A client naming a *registered* model id gets it, unclassified (CLIENT_PINNED).
# Set to false to make routing mandatory. Unknown ids are routed either way.
gatewai.classifier.client-pinning=true
# Minimum cosine similarity for a semantic route match; below it the heuristic
# decides. Default routes (bilingual EN/FR examples) are defined in
# ClassifierProperties; override via gatewai.classifier.routes[0].name=...,
# .routes[0].tier=..., .routes[0].examples[0]=... or the admin API/dashboard.
# 0.25 since v3 batch A.4: a similarity threshold belongs to an embedding
# model's scale, and the in-process model's scale is not nomic-embed-text's.
# At the old 0.60 it handed 88 of 100 labelled prompts to the heuristic (40 %
# accuracy); the sweep plateaus at 80–82 % between 0.15 and 0.30. This is the
# *fallback* used when no calibration is in force — POST /v1/admin/calibration
# supersedes it. See docs/technical/evaluation.md.
gatewai.classifier.route-similarity-threshold=0.25
# model-id blank => cheapest cloud-entry model from the registry above
gatewai.classifier.model-id=
gatewai.classifier.temperature=0.0
gatewai.classifier.fallback-to-heuristic=true

# Routing config propagation (v3 lot B.1). Everything above is the *seed*: the
# first node to start writes it to the routing_config table, and from then on the
# table is the source of truth -- edits through PUT /v1/admin/routing survive a
# restart, and every replica re-reads the row on this interval, so an edit made on
# one node reaches the others within it. Measured convergence on two nodes at the
# default: 2.05 s. Lower it for a shorter divergence window, raise it to cut the
# query rate; either way the window is bounded and documented, which is why this
# is polling rather than LISTEN/NOTIFY. See docs/technical/clustering.md.
gatewai.routing.config-sync-interval-ms=5000

# Occlusion attribution (v2 batch 7) — explains which parts of a prompt carried
# its routing decision. On demand only: it costs one local embedding call per
# segment plus one, so the cap is what bounds the load on Ollama.
gatewai.attribution.max-segments=20
# Sentences longer than this (chars) are cut at clause boundaries instead.
gatewai.attribution.max-segment-chars=200
# Reports cached per (prompt hash, embedding model, routing config version).
gatewai.attribution.cache-size=500

# Counterfactuals (v2 batch 8) — where a request would have gone instead. One
# alternative per reachable other tier, closest first; the chosen tier is
# excluded (a route leading back to it changes nothing). Costs one embedding
# call, so it is not cached.
gatewai.counterfactuals.max-alternatives=3

# Rate limiting per API client (Phase 6.2) — POSTs to /v1/chat/completions*
gatewai.ratelimit.enabled=true
gatewai.ratelimit.requests-per-minute=60
# Where the token buckets live (v3 lot B.3). memory = per process: correct and
# free on one node, but N replicas then allow N x the limit. postgres = one shared
# bucket per client, read with SELECT ... FOR UPDATE, so the limit is the
# cluster's. Default stays memory because that is what a single-node deployment
# wants and the added cost is not zero; set postgres when you run more than one
# instance. Measured cost of the shared store on the request path is published in
# docs/technical/security.md. See also docs/technical/clustering.md.
gatewai.ratelimit.store=memory

# MCP server exposure (Phase 6.4)
# Exposes the gateway as a Model Context Protocol server over WebMVC. The
# streamable-HTTP endpoint defaults to POST /mcp; clients authenticate with the
# same Bearer API key as /v1/** (see SecurityConfig). Set enabled=false to opt out.
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=gatewai-green-proxy
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.instructions=Green AI gateway: cost/carbon-aware routing, \
  semantic cache and CSRD-grade green accounting. Use 'routed_chat' to complete \
  prompts through the gateway, 'green_report' for aggregated cost and gCO2, and \
  'carbon_intensity' for the current grid intensity.

# Actuator + observability (Phase 6.1)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
# Common tag on every meter (handy in Grafana for multi-instance setups)
management.metrics.tags.application=gatewai
# Latency histogram buckets for the request timer
management.metrics.distribution.percentiles-histogram.gatewai.request.latency=true
# The rate-limit check is a database round trip when store=postgres, on the hot
# path. Publishing its own quantiles is what turns "is that expensive?" into a
# reading -- and what would justify a token-batching optimisation, or show it is
# not needed (v3 lot B.3).
management.metrics.distribution.percentiles.gatewai.ratelimit.check=0.5,0.95