# Dependency update PRs (v4 C.1). Weekly and grouped, so one maintainer reviews
# a handful of PRs a week rather than one per artifact.
#
# `cooldown` holds a release back for a week after it is published. A hijacked
# release is usually caught and pulled within days (litellm 1.82.7 and 1.82.8
# were live for about 40 minutes on PyPI); a week of delay costs nothing
# against that. Security updates are not delayed by it.
version: 2
updates:
  # Every `uses:` is pinned to a commit SHA with the version in a comment;
  # Dependabot rewrites both. scripts/check-pinned-actions.sh keeps it that way.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Most versions come from spring-boot-starter-parent; a parent bump is the
  # usual PR. Majors stay separate, minors and patches come together.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/main/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # @sveltejs/vite-plugin-svelte pins one vite major in its peer range, so a
      # major of either alone fails `npm ci` (PRs #5 and #7). Listed first: a
      # dependency joins the first group it matches, whatever the update type.
      vite:
        patterns: ["vite", "@sveltejs/vite-plugin-svelte"]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # svelte-check 4.7.x accepts typescript ^5 || ^6 only, so TypeScript 7
      # cannot install next to it (PR #3). Drop this once svelte-check does.
      - dependency-name: typescript
        versions: [">=7"]

  # The Dockerfile pins its base images by digest; this moves the digest (and
  # the tag next to it) when eclipse-temurin publishes a rebuild.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
