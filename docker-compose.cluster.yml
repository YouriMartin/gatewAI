# Two gateway replicas behind a load balancer, sharing one PostgreSQL
# (v3 lot B.5). This file exists to be *run*, not read: it is where lot B's four
# batches are proved to hold together.
#
#   docker compose -f docker-compose.cluster.yml up --build -d
#   ./scripts/cluster-smoke.sh          # the scenario
#   docker compose -f docker-compose.cluster.yml down -v
#
# http://localhost:8080 round-robins between the two nodes with no session
# affinity, so a request lands wherever the balancer sends it — which is what
# every mechanism in lot B has to survive. The nodes are also published
# individually on 8081 and 8082, because some of the scenario's checks are about
# what a *particular* node believes (config propagation, above all).
#
# The `mock` profile is on: this stack demonstrates *clustering*, and a real
# egress would add a ~3 GB model pull that tests nothing here. The cache, the
# router, the queue, the limiter and the schedulers all run for real — since
# v3 lot A they need no model server at all. For real inference use
# `docker-compose.yml`, or point a tier at a provider.
#
# Three settings are cluster-specific, and one of them is the thing to remember:
#   * GATEWAI_RATELIMIT_STORE=postgres — without it each replica enforces the
#     full quota on its own, so N nodes allow N x the limit (v3 lot B.3). This is
#     the one piece of lot B whose safe value is not the default.
#   * GATEWAI_INSTANCE_ID — names the node in `claimed_by` and in the `instance`
#     metric tag. Optional (it defaults to host:pid), set here for readability.
#   * GATEWAI_DECISIONS_RETENTION_DAYS=0 — a demo value, not a production one:
#     it makes every decision immediately purgeable, so the leader-gated purge
#     does something observable within one run instead of once every 90 days.

services:
  pgvector:
    image: 'pgvector/pgvector:pg17'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-greenaiproxy}'
      - 'POSTGRES_USER=${POSTGRES_USER:-dev}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev}'
    volumes:
      # ':z' relabels the file for SELinux (needed on Fedora/RHEL, harmless elsewhere)
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-greenaiproxy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway-1: &gateway
    build: .
    image: 'gatewai:latest'
    depends_on:
      pgvector:
        condition: service_healthy
    environment: &gateway-env
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_PROFILES_ACTIVE: 'mock'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://pgvector:5432/${POSTGRES_DB:-greenaiproxy}'
      SPRING_DATASOURCE_USERNAME: '${POSTGRES_USER:-dev}'
      SPRING_DATASOURCE_PASSWORD: '${POSTGRES_PASSWORD:-dev}'
      GATEWAI_ADMIN_API_KEY: '${GATEWAI_ADMIN_API_KEY:-gw_cluster-demo-admin-key}'
      GATEWAI_INSTANCE_ID: 'gateway-1'
      GATEWAI_RATELIMIT_STORE: 'postgres'
      GATEWAI_RATELIMIT_REQUESTS_PER_MINUTE: '${GATEWAI_RATELIMIT_REQUESTS_PER_MINUTE:-60}'
      GATEWAI_DISPATCH_ENABLED: 'true'
      GATEWAI_DISPATCH_POLL_INTERVAL_MS: '2000'
      GATEWAI_DECISIONS_RETENTION_DAYS: '0'
      GATEWAI_DECISIONS_PURGE_INTERVAL_MS: '5000'
      GATEWAI_ROUTING_CONFIG_SYNC_INTERVAL_MS: '5000'
      # Package, not class: an env var binds to a lowercased property name, and
      # a logger named after a camel-case class cannot survive that. The gate's
      # "skipping" line is DEBUG, and the scenario reads it.
      LOGGING_LEVEL_IO_GITHUB_YOURIMARTIN_GATEWAI_INFRASTRUCTURE_PERSISTENCE: 'DEBUG'
    ports:
      - '8081:8080'

  # Same image, same configuration, different name. That is the point: nothing
  # about a node is special, and neither is the first one to start.
  gateway-2:
    <<: *gateway
    environment:
      <<: *gateway-env
      GATEWAI_INSTANCE_ID: 'gateway-2'
    ports:
      - '8082:8080'

  # Minimal round-robin balancer, no session affinity — pinning would hide
  # exactly the bugs lot B set out to remove.
  balancer:
    image: 'nginx:alpine'
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy
    volumes:
      - ./docker/nginx/cluster.conf:/etc/nginx/conf.d/default.conf:ro,z
    ports:
      - '8080:8080'
