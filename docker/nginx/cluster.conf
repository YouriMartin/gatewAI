# Round-robin over the two gateway replicas (v3 lot B.5).
#
# Deliberately without session affinity: nothing in the gateway needs a client to
# come back to the same node, and pinning would hide exactly the bugs lot B set
# out to remove. The scenario in scripts/cluster-smoke.sh relies on consecutive
# requests landing on different nodes.
#
# X-Gatewai-Instance is echoed from the upstream so a caller can see which
# replica answered. It carries no authority — it is a debugging aid, not an
# identity.

upstream gatewai {
    server gateway-1:8080;
    server gateway-2:8080;
}

server {
    listen 8080;

    # SSE (streaming completions) must not be buffered by the balancer, or a
    # client waits for the whole answer to arrive as one block.
    proxy_buffering off;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://gatewai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        add_header X-Gatewai-Upstream $upstream_addr always;
    }
}
